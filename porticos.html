<link rel="stylesheet" href="./estilo.css">
<style>
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
.aviso{width:min(520px,100%);background:var(--panel);border:1px dashed var(--tinta-2);border-radius:6px;padding:32px 30px 34px}
.aviso svg{display:block;width:100%;height:auto;max-width:240px;margin:0 0 24px;color:var(--tinta);opacity:.55}

.aviso p{color:var(--tinta-2);margin:10px 0 24px;max-width:46ch}
.volver{display:inline-flex;padding:10px 16px;border:1px solid var(--tinta);border-radius:4px;font-size:15px;font-weight:700;color:var(--tinta);text-decoration:none}
.volver:hover{background:var(--tinta);color:#fff}
